<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Satota Electronics — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F16;
    --card: #121822;
    --card-border: #1E2733;
    --orange: #F97316;
    --orange-dark: #DB6A12;
    --text: #F5F7FA;
    --muted: #8B95A5;
    --input-bg: #0F141C;
    --input-border: #232C39;
    --input-border-focus: #F97316;
    --error: #F87171;
    --ok: #34D399;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 2.5rem 2.25rem 2.25rem;
  }

  .logo-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 2rem;
  }

  .mark {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    background: var(--orange);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.3rem;
    color: #fff;
    margin-bottom: 0.85rem;
  }

  .wordmark {
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }

  .wordmark-sub {
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-top: 0.15rem;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0 0 0.3rem;
    text-align: center;
  }

  .lede {
    font-size: 0.87rem;
    color: var(--muted);
    text-align: center;
    margin: 0 0 1.75rem;
    line-height: 1.5;
  }

  form { display: flex; flex-direction: column; gap: 1.05rem; }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 0.7rem 0.85rem;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    background: var(--input-bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease;
  }

  input::placeholder { color: #56606F; }

  input:focus-visible {
    border-color: var(--input-border-focus);
    box-shadow: 0 0 0 3px rgba(249,115,22,0.18);
  }

  button[type="submit"] {
    margin-top: 0.35rem;
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.8rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button[type="submit"]:hover { background: var(--orange-dark); }
  button[type="submit"]:disabled { background: #4A4038; cursor: not-allowed; }

  .status {
    min-height: 1.2rem;
    font-size: 0.83rem;
    margin-top: -0.25rem;
  }

  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }

  .divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1.6rem 0 1.35rem;
    color: var(--muted);
    font-size: 0.75rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  .request-row {
    text-align: center;
  }

  .request-row p {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 0.7rem;
  }

  .request-btn {
    display: inline-block;
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--orange);
    border-radius: 8px;
    color: var(--orange);
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    box-sizing: border-box;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .request-btn:hover {
    background: rgba(249,115,22,0.12);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="card">

  <div class="logo-row">
    <div class="mark">S</div>
    <div class="wordmark">Satota Electronics</div>
    <div class="wordmark-sub">ELECTRONICS</div>
  </div>

  <h1>Sign in</h1>
  <p class="lede">Enter your email and password to continue.</p>

  <form id="signinForm">
    <div>
      <label for="siEmail">Email</label>
      <input type="email" id="siEmail" placeholder="you@example.com" autocomplete="email" required />
    </div>
    <div>
      <label for="siPassword">Password</label>
      <input type="password" id="siPassword" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <div class="status" id="siStatus"></div>
    <button type="submit" id="siBtn">Sign in</button>
  </form>

  <div class="divider">OR</div>

  <div class="request-row">
    <p>Don't have access yet?</p>
    <a
      class="request-btn"
      href="mailto:rahatulislamfahim0172@gmail.com?subject=Satota%20Electronics%20-%20Access%20Request&body=Hi%2C%0A%0AI'd%20like%20access%20to%20the%20Satota%20Electronics%20shop%20management%20app.%0A%0AName%3A%0APhone%3A%0A"
    >Request access</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- Supabase project connection ----
  const SUPABASE_URL = "https://hjmtbpokyuyctvlsmkyr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_P0wRpIBl7WAe-RIwXqztjA_7DsJ1A9d";

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Where to send people once they're logged in.
  // Change this to match your app's main page filename.
  const REDIRECT_AFTER_LOGIN = "index.html";

  // ---- If already logged in, skip straight to the app ----
  db.auth.getSession().then(({ data }) => {
    if (data.session) {
      window.location.href = REDIRECT_AFTER_LOGIN;
    }
  });

  // ---- Sign in ----
  const signinForm = document.getElementById('signinForm');
  const siStatus = document.getElementById('siStatus');
  const siBtn = document.getElementById('siBtn');

  signinForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    siStatus.textContent = '';
    siStatus.className = 'status';
    siBtn.disabled = true;
    siBtn.textContent = 'Signing in…';

    const email = document.getElementById('siEmail').value.trim();
    const password = document.getElementById('siPassword').value;

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      siStatus.textContent = error.message;
      siStatus.className = 'status error';
      siBtn.disabled = false;
      siBtn.textContent = 'Sign in';
      return;
    }

    siStatus.textContent = 'Signed in. Redirecting…';
    siStatus.className = 'status ok';
    window.location.href = REDIRECT_AFTER_LOGIN;
  });
</script>

</body>
</html>
Move login.html into public folder
